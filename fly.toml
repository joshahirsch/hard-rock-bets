# fly.toml app configuration file generated for hard-rock-bets on 2026-08-12T05:11:33Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hard-rock-bets'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
